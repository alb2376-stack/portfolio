    if(mode === "both") lg += '<h3>Will need scaffolding</h3>'+stat('<span class="sw" style="background:#fff;border:1.5px solid #111"></span>Building over six floors', tallN);
    if(mode === "next") lg += '<h3>Buildings over six floors</h3>'+
      stat('<span class="sw" style="background:#555"></span>Filled = shed up now', tallShed)+
      stat('<span class="sw" style="background:#fff;border:1.5px solid #555"></span>Faint = no shed yet', tallN-tallShed)+
      '<h3>Colour = inspection sub-cycle</h3>'+Object.keys(SUBCYC).map(k => stat('<span class="sw" style="background:'+SUBCYC[k].color+'"></span>'+SUBCYC[k].label, subCount(k))).join("");
    if(mode === "blank") lg = '<h3>'+(ph ? ph.title : "")+'</h3>'+stat("Status", "work in progress")+stat("Base map", "streets");
    if(NEED && ph.tops){
      lg = '<h3>Overlay score, low → high</h3><div style="height:11px;margin:4px 0 4px;background:linear-gradient(90deg,'+OVL_RAMP.join(",")+')"></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px"><span>0</span><span>100</span></div>'+
        '<h3>Tier · now ● / next ■</h3>'+TIERS.map(t => stat('<span class="sw" style="background:'+t.color+';border:1.5px solid #111"></span>'+t.name, TOPS.filter(o=>o.t===t).length+' / '+NEXT.filter(o=>o.tr===t).length)).join("")+
        stat('<span class="sw" style="background:#fff;border:1px solid #999"></span>Not in programme', TOPS.filter(o=>!o.t).length+' / '+NEXT.filter(o=>!o.tr).length)+
        '<h3>Shapes</h3>'+stat('● Circle', 'shed up now')+stat('■ Square', 'over 6 floors, shed likely next')+
        '<h3>How it’s funded</h3><svg viewBox="0 0 250 236" style="width:100%;display:block;margin-top:4px;font-family:inherit"><defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#111" stroke-width="1.4"/></marker></defs><g font-size="9" fill="#111" text-anchor="middle"><rect x="1" y="1" width="118" height="40" fill="#fff" stroke="#111"/><text x="60" y="17" font-weight="600">OVERSTAY FEE</text><text x="60" y="31" fill="#666">every shed past 180 days</text><rect x="131" y="1" width="118" height="40" fill="#fff" stroke="#111"/><text x="190" y="17" font-weight="600">RENEWAL SURCHARGE</text><text x="190" y="31" fill="#666">every 90-day permit</text><path d="M60 41V58H118V68M190 41V58H132V68" fill="none" stroke="#111" marker-end="url(#fa)"/><rect x="55" y="72" width="140" height="40" fill="#111"/><text x="125" y="88" font-weight="600" fill="#fff">TOPS KIT FUND</text><text x="125" y="102" fill="#bbb">pooled · CB10 oversight</text><path d="M125 112V126M42 126H208M42 126V136M125 126V136M208 126V136" fill="none" stroke="#111"/><path d="M42 130V138M125 130V138M208 130V138" fill="none" stroke="#111" marker-end="url(#fa)"/><rect x="1" y="142" width="80" height="40" fill="#fff" stroke="#111"/><text x="41" y="158" font-weight="600">KIT III</text><text x="41" y="172" fill="#666">basic, fully paid</text><rect x="85" y="142" width="80" height="40" fill="#fff" stroke="#111"/><text x="125" y="158" font-weight="600">KIT I · II</text><text x="125" y="172" fill="#666">premium top-up</text><rect x="169" y="142" width="80" height="40" fill="#fff" stroke="#111"/><text x="209" y="158" font-weight="600">STEWARDS</text><text x="209" y="172" fill="#666">paid to maintain</text><text x="125" y="204" fill="#666">overstay is never rewarded: every shed pays</text><text x="125" y="220" fill="#666">overstay money buys more public space</text></g></svg>';
    }
    else if(NEED && ["idx","ovl","ling","supp"].includes(ph.cat)){
      const RMP = rampFor(ph.cat);
      const lst = (title, set) => '<h3>'+title+'</h3><div class="colhd"><span></span><span></span><span></span><span>In CD 10</span></div>'+
        Object.values(set).map(d => '<div class="lyr" style="cursor:default"><span></span><span class="nm"><span class="sw" style="background:'+d.color+'"></span>'+d.name+'</span><span></span><span class="vl">'+d.pts().filter(p => p[2]===110).length+'</span></div>').join("");
      lg = '<h3>'+({idx:"Linger gap",ovl:"Overlay score",ling:"Informal lingering",supp:"Formal supply"})[ph.cat]+', low → high</h3><div style="height:11px;margin:4px 0 4px;background:linear-gradient(90deg,'+RMP.join(",")+')"></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px"><span>low</span><span>high</span></div>'+
        (AREAS.length ? stat('<span class="sw" style="background:#111"></span>Numbered area', AREAS.length) : '')+
        (ph.cat==="ovl" ? '<h3>Combines</h3>'+stat('<span class="sw" style="background:#2171b5"></span>01 Linger index', 'informal × low supply')+stat('<span class="sw" style="background:#ec7014"></span>02 Need', 'seniors · kids · public space · activity')
          : (ph.cat!=="supp" ? lst("Informal lingering (adds)", LING) : '')+(ph.cat!=="ling" ? lst("Formal supply"+(ph.cat==="idx"?" (subtracts)":""), SUPP) : ''));
    }
    else if(NEED){
      const cnt = c => needPts().filter(p => p.c===c && inRing(h.px(p.lon), h.py(p.lat), geoBy[h.cd].rings[0].map(q => [h.px(q[0]), h.py(q[1])]))).length;
      lg = '<h3>Need, low → high</h3><div style="height:11px;margin:4px 0 4px;background:linear-gradient(90deg,'+NEED_RAMP.join(",")+')"></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px"><span>low</span><span>high</span></div>'+
        stat('<span class="sw" style="background:#111"></span>Numbered area of need', AREAS.length)+
        '<h3>Datasets included</h3><div class="colhd"><span></span><span></span><span></span><span>In CD 10</span></div>'+
        Object.keys(NEED_CATS).filter(c => ph.cat==="all" || c===ph.cat).map(c => '<div class="lyr" style="cursor:default"><span></span><span class="nm"><span class="sw" style="background:'+NEED_CATS[c].color+'"></span>'+NEED_CATS[c].name+
          ' <span style="color:#999">· '+NEED_CATS[c].sub+'</span></span><span></span><span class="vl">'+cnt(c)+'</span></div>').join("");
    }
    document.getElementById("legendbox").innerHTML = lg;
    document.getElementById("panel").innerHTML = "";
  }
  const X2_PH = {
    tops: { title:"Hyper Scaffold: TOPS", plan:[
      "<b>TOPS rule v1:</b> any sidewalk shed on a block scoring <b>60+</b> on the Overlay, with <b>12 ft+</b> of sidewalk, offers a free public kit within <b>14 days</b>.",
      "<b>Kit:</b> seats every 25 ft (backed and backless), lean bar on narrow walks, shade, warm light, notice board; water and charging near seniors and transit. A <b>5 ft clear path</b> always.",
      "<b>Time:</b> 90-day permits renew only with proof of work; the <b>180-day penalty still applies</b>; the kit leaves with the shed and moves on.",
      "<b>Open to all:</b> no purchase, no ads, no hostile design, no loitering enforcement.",
      "<b>Blocks decide:</b> the block association or Community Board 10 can choose a light kit or veto; a local steward is paid to care for it.",
      "<b>Next:</b> map which current sheds and the 121 buildings due by Feb 2027 qualify, with sliders for the score threshold and sidewalk width."] },
    index:   { title:"New Linger Index", plan:[
      "Lingering need: informal lingering (stoops, vendors, barbershops, laundromats) plus who needs rest (seniors, children, heat-vulnerable blocks)",
      "Formal supply: parks, benches, bus shelters, libraries, POPS",
      "Gap score = need minus supply, by block face",
      "Which sheds sit on high-gap blocks — where a Hyper Scaffold would matter most"] },
    need:    { title:"Need", plan:[
      "Demographics: older adults, children, households without a car",
      "Heat vulnerability and shade",
      "Bus stops, clinics, senior centers and schools — where people need to rest on the way",
      "Distance to the next place to sit",
      "Other analyses to add"] },
    overlay: { title:"Overlay", plan:[
      "Sheds now and next, on top of the Linger Index and Need layers",
      "Find blocks where scaffolding, unmet need and few formal places coincide",
      "Shortlist of candidate sites for a pilot"] }
  };

  const VIEWS = {
    x2_idx:  { cap:"", run:()=>renderX2("need", { cat:"idx" }),
      note:"Experiment 1 data only, for Central Harlem. Informal lingering: estimated stoops (PLUTO), food vendor spots (311), barbershops (NYS licences), laundromats (OpenStreetMap). Formal supply: city benches, bus shelters, parks (weighted by acreage), libraries. Sheds, POPS (none in Harlem) and the need data are left out." },
    x2_ling: { cap:"", run:()=>renderX2("need", { cat:"ling" }), note:"Informal lingering only. Each of the four kinds is scaled equally, so the ~2,000 stoops don't drown out the vendors, barbers and laundromats." },
    x2_supp: { cap:"", run:()=>renderX2("need", { cat:"supp" }), note:"Formal supply only: benches, bus shelters, parks (bigger parks count more) and libraries." },
    x2_need_all: { cap:"", run:()=>renderX2("need", { cat:"all" }),
      note:"Speculative. Places that create a need to pause, from the NYC Facilities Database (senior centers; schools, day care and pre-K; parks, gardens, plazas, libraries), MTA subway entrances and DOT bus shelters. Each place spreads need over ~450 m with a smooth falloff; the four kinds are scaled equally and averaged." },
    x2_need_S: { cap:"", run:()=>renderX2("need", { cat:"S" }), note:"Senior centers and senior service sites (NYC Facilities Database)." },
    x2_need_K: { cap:"", run:()=>renderX2("need", { cat:"K" }), note:"Public, charter and private schools, day care and pre-K (NYC Facilities Database)." },
    x2_need_P: { cap:"", run:()=>renderX2("need", { cat:"P" }), note:"Parks, gardens, plazas, recreation sites, POPS and libraries (NYC Facilities Database)." },
    x2_need_A: { cap:"", run:()=>renderX2("need", { cat:"A" }), note:"Subway entrances (MTA) and bus shelters (NYC DOT) — where people wait and arrive." },
    x2_tops: { cap:"", run:()=>renderX2("need", { cat:"ovl", tops:true }),
      note:"TOPS — Temporary Open Public Space, modelled on POPS. An active shed qualifies when its 240 m hexagon scores at least the chosen minimum on the Overlay (01 Linger index × 02 Need); the score sets its incentive tier. Sheds: DOB active permits, Nov 4 2026." },
    x2_ovl: { cap:"", run:()=>renderX2("need", { cat:"ovl" }),
      note:"Overlay of 01 Linger index and 02 Need, combined as their geometric mean so an area must be high on both. Speculative: a way to shortlist blocks to study and test, not a verdict." },
    x2_both: { cap:"", run:()=>renderX2("both"),
      note:"Active sheds: DOB NOW approved sidewalk-shed permits in Community District 10 that are issued and not expired (Nov 4 2026). Days up = since the first permit of the same job. DOB NOW records begin around 2016–2020, so the oldest sheds may have been up even longer. Rings: PLUTO lots over six floors, which must have facade inspections (Local Law 11 / FISP) and usually need scaffolding for them." },
    x2_days: { cap:"", run:()=>renderX2("days"),
      note:"Colour = how long each active shed has been up. Since 2025 the city penalises sheds up longer than 180 days, so the orange-to-purple dots are the ones city policy now targets." },
    x2_next: { cap:"", run:()=>renderX2("next"),
      note:"Buildings over six floors, coloured by their facade-inspection sub-cycle in Cycle 10, which is set by the last digit of the tax block: 10A (4, 5, 6, 9), 10B (0, 7, 8), 10C (1, 2, 3). Filled rings already have a shed; faint rings are where scaffolding is likely to appear next." },
    a_sit:     { cap:"", note:HEXSETS.a_sit.note,     run:()=>renderHex("a_sit") },
    a_shelter: { cap:"", note:HEXSETS.a_shelter.note, run:()=>renderHex("a_shelter") },
    a_social:  { cap:"", note:HEXSETS.a_social.note,  run:()=>renderHex("a_social") },
    a_unpaid:  { cap:"", note:HEXSETS.a_unpaid.note,  run:()=>renderHex("a_unpaid") },
    a_paid:    { cap:"", note:HEXSETS.a_paid.note,    run:()=>renderHex("a_paid") },
    a_open:    { cap:"", note:HEXSETS.a_open.note,    run:()=>renderHex("a_open") },
    l_stoops:  { cap:"", run:()=>{ renderLayer(["stoop_hi","stoop_lo","benches"], "Sit — stoops + benches"); document.getElementById("panel").innerHTML = sitPanel(); },
      note:"Estimated from PLUTO, not counted: lots built by 1915, 3–6 floors, 12–27 ft wide; row-house classes = likely high stoop, walk-up tenement classes = likely low stoop. For the sitting area estimate: 70% of row houses and 30% of tenements assumed to keep a usable stoop; 4/6/10 seats per high stoop, 2/4/6 per low stoop; 3 per bench; 0.27 m² per seated person." },
    l_shelters:{ cap:"", run:()=>renderLayer("shelters"), note:"NYC DOT Bus Stop Shelters." },
    l_vendors: { cap:"", run:()=>renderLayer("vendors"),
      note:"No dataset records where food vendors stand, so these are 311 'Mobile Food Vendor' complaints from the past year, grouped by spot. A recurring complaint spot is a good sign of a recurring vendor; bigger dot = more complaints." },
    l_libraries:{ cap:"", run:()=>renderLayer("libraries"), note:"NYC Facilities Database: public, academic and special libraries." },
    l_laundromats:{ cap:"", run:()=>renderLayer("laundromats"), note:"OpenStreetMap self-service laundromats. Clearly incomplete, especially in Harlem — a placeholder until a better source or fieldwork count." },
    l_barbers: { cap:"", run:()=>renderLayer("barbers"),
      note:"NYS barbershop owner licences, plus appearance-enhancement businesses with 'barber' in their name. Many shops are licensed under the broader category, so Harlem is likely undercounted." },
    c_sit: { cap:"", run:()=>renderCondition("c_sit"),
      note:"Stoops are estimated, not counted: PLUTO lots built by 1915, 3–6 floors, 12–27 ft wide, row-house classes (high stoop) or walk-up tenement classes (low stoop). Assumes 70% of row houses and 30% of tenements keep a usable stoop; 4/6/10 seats per high stoop and 2/4/6 per low stoop (low/mid/high); 3 seats per bench; 0.27 m² per seated person." },
    c_shelter: { cap:"", run:()=>renderCondition("c_shelter"),
      note:"Bus stop shelters: NYC DOT. Sidewalk sheds: buildings with a DOB shed permit on record (all years, from your Datasets folder), so not every one is standing today." },
    c_social: { cap:"", run:()=>renderCondition("c_social"),
      note:"Food vendors have no location dataset, so these are 311 'Mobile Food Vendor' complaints from the past year grouped by spot; bigger dot = more complaints. Libraries: Facilities Database. Barbershops: NYS licences, including appearance businesses with 'barber' in the name. Laundromats: OpenStreetMap, which is incomplete." },
    c_permission: { cap:"", note:"", run:()=>renderCondition("c_permission") },
    formal:   { cap:HEXSETS.formal.cap,   note:HEXSETS.formal.note,   run:()=>renderHex("formal") },
    informal: { cap:HEXSETS.informal.cap, note:HEXSETS.informal.note, run:()=>renderHex("informal") },
    all:  { cap:"", run:renderAll,
            note:"Every dataset at once, drawn at the same scale in both districts. Untick a layer to hide it; hover a dot for details. Stoops are estimated from PLUTO, food vendors are 311 complaint spots, laundromats come from OpenStreetMap." },
    sheds:{ cap:"Buildings with a <b>sidewalk shed permit</b> on record — shelter by accident, the scaffolding a pedestrian can wait under.",
            note:"From DOB permits with subtype SH. Permits are grouped by building; addresses were matched to coordinates with NYC Planning's address search. Records span all years, not only sheds standing today.", run:()=>renderLayer("sheds") },
    benches:{ cap:"<b>City benches</b> installed by DOT's CityBench program and its partners — the city's explicit invitation to sit.",
            note:"City Bench Locations (Historical) — includes benches that may since have been removed.", run:()=>renderLayer("benches") },
    pops: { cap:"<b>Privately owned public spaces</b> — plazas and arcades that buildings provide in exchange for extra floor area.",
            note:"POPS are concentrated where zoning bonuses were used. Central Harlem has none on record.", run:()=>renderLayer("pops") },
    parks:{ cap:"<b>Parks properties</b> — parks, playgrounds, gardens, triangles and plazas, shaded at their real extent.",
            note:"A park is assigned to the district that contains a point inside it. Large parks such as Central Park and Morningside Park sit just outside both districts.", run:()=>renderLayer("parks") },
    count:{ cap:"How many records of each kind fall inside each district.", note:"Raw counts. Midtown and Central Harlem differ in size — see per square mile.", run:()=>renderCompare("count") },
    density:{ cap:"Records per square mile — a size-normalized comparison of the two districts.", note:"Area is computed from the community district outline.", run:()=>renderCompare("density") },
    fvi:{ cap:"", run:renderFormalCompare,
      note:"Split by design intent: formal places were built for people to pause; informal ones were built for something else and get lingered in anyway. Sheds are shown both in and out because they dominate the informal count." },
    idxH: { cap:"Every place in <b>Central Harlem</b>, by name, grouped by affordance. Click a name to point it out on its map.",
            note:"", run:()=>renderIndexTab("harlem") },
    idxM: { cap:"Every place in <b>Midtown</b>, by name, grouped by affordance. Click a name to point it out on its map.",
            note:"", run:()=>renderIndexTab("midtown") }
  };
  Object.keys(HEXSETS).forEach(k => {
    VIEWS[k+"_pts"] = { cap:"", note:HEXSETS[k].note.replace(/,? (counted )?per hexagon/g,"").replace("Every hexagon is the same size in both districts and both maps share one colour scale, so cells compare directly. Empty cells are outlined only.","The same datasets as the hexbin map, drawn as individual points. Untick a dataset to hide it."), run:()=>renderHexPoints(k) };
  });
  const TABS = [
    { subs:[["All places","all"]] },
    { subs:[["Sheds","sheds"],["Benches","benches"],["POPS","pops"],["Parks","parks"],["Stoops","l_stoops"],["Bus shelters","l_shelters"],["Food vendors","l_vendors"],["Libraries","l_libraries"],["Laundromats","l_laundromats"],["Barbershops","l_barbers"]] },
    { subs:[["Count","count"],["Per square mile","density"],["Formal vs informal","fvi"]] },
    { switch:true, subs:[["Formal","formal"],["Informal","informal"]] },
    { switch:true, subs:[["Sit","a_sit"],["Shelter","a_shelter"],["Social magnets","a_social"],["Permission — unpaid","a_unpaid"],["Permission — paid","a_paid"],["Permission — open","a_open"]] },
    { subs:[["Central Harlem","idxH"],["Midtown","idxM"]] },
    { subs:[["Sheds now + buildings next","x2_both"],["How long sheds have been up","x2_days"],["Who's next: inspection cycle","x2_next"]] },
    { subs:[["Linger index","x2_idx"],["Informal lingering","x2_ling"],["Formal supply","x2_supp"]] },
    { subs:[["Areas of need","x2_need_all"],["Seniors","x2_need_S"],["Kids","x2_need_K"],["Public space","x2_need_P"],["Activity","x2_need_A"]] },
    { subs:[["Index × Need","x2_ovl"]] },
    { subs:[["TOPS rule v1","x2_tops"]] }
  ];

  let tab=0, sub=0, mapMode="hex", needView="hex";   // mapMode: "hex" = hexbin map, "pts" = location map
  function render(){
    const t = TABS[tab], sn = document.getElementById("subnav");
    sn.style.display = t.subs.length>1 || t.switch || (tab>=7 && tab<=9) ? "flex" : "none";
    sn.innerHTML = t.subs.map((s,i) => '<button data-s="'+i+'" class="'+(i===sub?"on":"")+'">'+s[0]+'</button>').join("");
    if(t.switch) sn.innerHTML += '<div class="modesw"><button data-m="hex" class="'+(mapMode==="hex"?"on":"")+'">Hexbin map</button>'+
                                  '<button data-m="pts" class="'+(mapMode==="pts"?"on":"")+'">Location map</button></div>';
    if(tab>=7 && tab<=9) sn.innerHTML += '<div class="modesw"><button data-nv="hex" class="'+(needView==="hex"?"on":"")+'">Hexbin scores</button>'+
                                         '<button data-nv="heat" class="'+(needView==="heat"?"on":"")+'">Heat map</button></div>';
    sn.querySelectorAll("button[data-nv]").forEach(b => b.onclick = () => { needView=b.dataset.nv; render(); });
    sn.querySelectorAll("button[data-s]").forEach(b => b.onclick = () => { sub=+b.dataset.s; render(); });
    sn.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => { mapMode=b.dataset.m; render(); });
    const vkey = t.subs[sub][1] + (t.switch && mapMode==="pts" ? "_pts" : "");
    const v = VIEWS[vkey];
    if(tab!==1) LAYERS.forEach(L => on[L.key] = on[L.key]); // keep toggles
    document.getElementById("cap").innerHTML = v.cap;
    document.getElementById("note").textContent = v.note;
    document.getElementById("note").style.display = v.note ? "" : "none";
    hideTip(); v.run();
    fitAside();
  }
  // last resort on small screens: scale the sidebar down until it fits without scrolling
  function fitAside(){
    const a = document.querySelector("aside"); a.style.zoom = 1;
    if(innerWidth <= 900) return;
    let z = 1;
    while(z > .6 && a.scrollHeight > a.clientHeight + 1){ z -= .02; a.style.zoom = z; }
  }
  function goTo(t, s){
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", +x.dataset.t===t));
    tab=t; sub=s||0;
    if(tab===0) Object.keys(ALL_LAYERS).forEach(k => on[k] = true);
    render();
  }
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => goTo(+b.dataset.t, 0));
  // each experiment owns a set of the numbered tabs; tabs without data-x belong to Experiment 1
  let exp = "1";
  const firstTab = { "1":0, "2":7 };
  function setExperiment(x){
    exp = x;
    document.querySelectorAll("#experiments button").forEach(b => b.classList.toggle("on", b.dataset.x===x));
    document.querySelectorAll("#tabs button").forEach(b => b.style.display = (b.dataset.x || "1")===x ? "" : "none");
    goTo(firstTab[x], 0);
  }
  document.querySelectorAll("#experiments button").forEach(b => b.onclick = () => setExperiment(b.dataset.x));

  const total = Object.values(ALL_LAYERS).reduce((a,L) => a+dataOf(L).length, 0);
  document.getElementById("hdrmeta").textContent =
    nf(total)+" places · 2 community districts · "+Object.keys(ALL_LAYERS).length+" layers";
  render();
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });
})();
</script>
<script>
  /* Embed mode for the portfolio: atlas/index.html?view=tops opens straight on
     Experiment 2 > Hyper Scaffold: TOPS (the one with the score slider) and hides
     the other experiments and step tabs. Without the parameter the full atlas loads. */
  (function () {
    if (new URLSearchParams(location.search).get("view") !== "tops") return;
    var css = document.createElement("style");
    css.textContent = "nav#experiments, nav#tabs { display: none !important; }";
    document.head.appendChild(css);
    var exp2 = document.querySelector('#experiments button[data-x="2"]');
    if (exp2) exp2.click();
    var tops = Array.prototype.find.call(document.querySelectorAll("#tabs button"), function (b) {
      return b.textContent.indexOf("Hyper Scaffold") !== -1;
    });
    if (tops) tops.click();
  })();
</script>
</body>
</html>
