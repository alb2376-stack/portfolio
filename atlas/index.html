<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas of Lingering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111; --paper:#fff; --line:#000; --muted:#666; --faint:#e5e5e5;
    --base-fill:#f4f4f4; --base-stroke:#111;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{border-bottom:1px solid var(--line); padding:28px 32px 20px}
  h1{
    font-family:'Archivo Black',"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-weight:400; font-size:30px; margin:0 0 8px; letter-spacing:-.01em; line-height:1.05;
  }
  .sub{font-size:13px; color:var(--muted); margin:0}
  .meta{font-size:11px; color:var(--muted); margin-top:10px; letter-spacing:.06em; text-transform:uppercase}

  nav{display:flex; border-bottom:1px solid var(--line); flex-wrap:wrap}
  nav button{
    background:none; border:0; border-right:1px solid var(--faint);
    padding:13px 22px; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; color:var(--muted); font-family:inherit;
  }
  nav button:hover{background:#fafafa; color:var(--ink)}
  nav button.on{background:var(--ink); color:#fff}

  .subnav{display:flex; border-bottom:1px solid var(--faint); background:#fafafa; flex-wrap:wrap}
  .subnav button{
    background:none; border:0; padding:10px 20px; font-size:11px;
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    color:var(--muted); font-family:inherit; border-right:1px solid var(--faint);
  }
  .subnav .modesw{margin-left:auto; display:flex; align-items:center; gap:0; padding:0 12px}
  .subnav .modesw button{border:1px solid #111; border-right:0; padding:4px 12px; font-size:10.5px; color:#111; background:#fff}
  .subnav .modesw button:last-child{border-right:1px solid #111}
  .subnav .modesw button.on{background:#111; color:#fff; font-weight:600; box-shadow:none}
  .subnav button.on{color:var(--ink); font-weight:600; box-shadow:inset 0 -2px 0 var(--ink)}

  .wrap{display:flex; align-items:stretch; min-height:70vh}
  .stage{flex:1 1 auto; padding:18px 24px; min-width:0}
  aside{flex:0 0 290px; border-left:1px solid var(--faint); padding:22px 22px 30px; font-size:12px; background:#fcfcfc}
  @media(max-width:900px){ .wrap{flex-direction:column} aside{flex:auto; border-left:0; border-top:1px solid var(--faint)} }

  .cap{font-size:12px; color:var(--muted); margin:0 0 14px; line-height:1.5; max-width:820px}
  .cap b{color:var(--ink); font-weight:600}

  .maps{display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap}
  .mapcol{flex:1 1 300px; min-width:0}
  .mapcol h2{font-size:11px; letter-spacing:.09em; text-transform:uppercase; margin:0 0 6px; font-weight:600;
    display:flex; justify-content:space-between; border-bottom:1px solid var(--ink); padding-bottom:6px}
  .mapcol h2 span{color:var(--muted); font-weight:400}
  .mapcol svg{width:100%; height:auto; display:block}

  aside h3{font-size:11px; letter-spacing:.09em; text-transform:uppercase; margin:0 0 10px; color:var(--muted); font-weight:400}
  aside h3:not(:first-child), #panel h3{margin-top:26px}

  .lyr{display:grid; grid-template-columns:14px 1fr auto auto; gap:8px; align-items:center;
    padding:6px 0; border-bottom:1px solid #eee; cursor:pointer; user-select:none}
  .lyr input{margin:0; accent-color:#111}
  .lyr .nm{font-size:11px}
  .lyr .vl{font-variant-numeric:tabular-nums; font-weight:600; font-size:11px; min-width:26px; text-align:right}
  .lyr .vl.h{color:var(--muted); font-weight:400}
  .sw{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:-1px}
  .colhd{display:grid; grid-template-columns:14px 1fr auto auto; gap:8px; font-size:9.5px; color:#999;
    letter-spacing:.06em; text-transform:uppercase; padding-bottom:4px}
  .colhd span:nth-child(3),.colhd span:nth-child(4){min-width:26px; text-align:right}

  .stat{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee; font-size:11px}
  .stat b{font-variant-numeric:tabular-nums}

  .rank{list-style:none; margin:0; padding:0}
  .rank li{display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #eee; line-height:1.35; cursor:pointer}
  .rank li:hover{background:#f3f3f3}
  .rank .nm{flex:1; font-size:11px}
  .rank .vl{font-variant-numeric:tabular-nums; font-weight:600; font-size:11px; white-space:nowrap}
  .rank li span.i{color:#bbb; font-size:10px; margin-right:6px}

  /* index of places */
  .index{margin-top:30px; border-top:1px solid var(--ink); padding-top:14px}
  .index h2{font-size:11px; letter-spacing:.09em; text-transform:uppercase; margin:0 0 12px; font-weight:600}
  .idxgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:22px 28px}
  .idxgrid h4{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 6px; font-weight:600;
    display:flex; justify-content:space-between; border-bottom:1px solid #ddd; padding-bottom:5px}
  .idxgrid h4 span{color:var(--muted); font-weight:400}
  .idxgrid ol{list-style:none; margin:0; padding:0; font-size:11px; line-height:1.35}
  .idxgrid li{display:flex; gap:8px; padding:3px 0; border-bottom:1px solid #f0f0f0; cursor:pointer}
  .idxgrid li:hover{background:#f3f3f3}
  .idxgrid li .n{color:#bbb; font-size:10px; min-width:22px; font-variant-numeric:tabular-nums}
  .idxgrid li .r{margin-left:auto; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums}
  .idxgrid .more{font-size:10.5px; color:var(--muted); padding-top:6px}

  /* compare bars */
  .bars{max-width:900px}
  .bars .row{display:grid; grid-template-columns:150px 1fr 60px; gap:12px; align-items:center; padding:7px 0; border-bottom:1px solid #eee; font-size:11px}
  .bars .track{position:relative; height:26px}
  .bars .b{height:11px; margin:1px 0}
  .bars .v{font-variant-numeric:tabular-nums; text-align:right; line-height:13px}
  .bars .bgrp{font-family:'Archivo Black',"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:13px; margin:12px 0 2px; padding-top:4px; border-top:2px solid var(--ink)}
  .bars .row{padding:4px 0}
  .bars .track{height:24px}
  .bars .key{display:flex; gap:18px; font-size:10.5px; color:var(--muted); margin:0 0 10px; text-transform:uppercase; letter-spacing:.06em}
  .bars .key i{display:inline-block; width:14px; height:9px; margin-right:6px; vertical-align:-1px}

  #tip{
    position:fixed; pointer-events:none; background:var(--ink); color:#fff;
    padding:8px 11px; font-size:11px; line-height:1.5; border-radius:2px;
    opacity:0; transition:opacity .1s; max-width:260px; z-index:99;
  }
  #tip b{display:block; margin-bottom:4px; font-size:11px}
  #tip .k{display:block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.7; margin-bottom:2px}
  footer{border-top:1px solid var(--line); padding:18px 32px; font-size:11px; color:var(--muted)}
  .note{font-size:10.5px; color:#999; line-height:1.5; margin-top:20px; border-top:1px solid #eee; padding-top:12px}
  /* ---------- fit the whole site in the window, no page scroll (like the scaffolding map's embed mode) ---------- */
  html,body{height:100%}
  body{height:100vh; display:flex; flex-direction:column; overflow:hidden}
  header{padding:14px 24px 10px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap}
  h1{font-size:22px; margin:0}
  .sub{font-size:12px}
  .meta{margin:0 0 0 auto}
  /* experiments: the top-level parts of the atlas; the numbered tabs below belong to the selected experiment */
  .experiments{display:flex; gap:0; align-self:center; margin-left:10px}
  .experiments button{font-family:'Archivo Black',"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:13px; letter-spacing:.04em;
    text-transform:uppercase; background:#fff; color:#111; border:1.5px solid #111; padding:5px 12px; cursor:pointer}
  .experiments button + button{border-left:0}
  .experiments button.on{background:#111; color:#fff}
  .experiments button span{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:.06em; font-weight:400;
    opacity:.75; margin-left:8px}
  nav button{padding:9px 18px}
  .subnav button{padding:7px 18px}
  .wrap{flex:1 1 auto; min-height:0}
  .stage{display:flex; flex-direction:column; min-height:0; padding:10px 20px}
  .cap{margin:0 0 8px}
  #canvas{flex:1 1 auto; min-height:0}
  .maps{height:100%; flex-wrap:nowrap; gap:20px}
  .mapcol{display:flex; flex-direction:column; height:100%; min-height:0}
  .mapcol > div{flex:1 1 auto; min-height:0}
  .mapcol svg{width:100%; height:100%}
  aside{overflow-y:auto; padding:14px 18px}
  .index{margin-top:22px; padding-top:12px}
  .index:empty{display:none}
  .mapcol.x2side{display:block; overflow:hidden; padding-left:6px; height:100%}
  .x2side > div{flex:none}
  .x2bars{margin:6px 0 8px}
  .x2row{display:grid; grid-template-columns:minmax(120px,48%) 1fr 34px; gap:8px; align-items:center; font-size:11px; padding:3px 0}
  .x2row b{text-align:right; font-variant-numeric:tabular-nums}
  .x2track{height:11px; background:#f2f2f2}
  .x2track div{height:100%}
  .x2stats .stat{font-size:11px}
  .wiptag{font-size:9px; letter-spacing:.08em; border:1px solid currentColor; padding:1px 4px; margin-left:4px; opacity:.7}
  .wip{border:1.5px dashed #bbb; color:#999; font-size:12px; letter-spacing:.06em; text-transform:uppercase; text-align:center; padding:22px 10px; margin:8px 0 4px}
  .plan{margin:6px 0 0; padding-left:16px; font-size:11.5px; line-height:1.45; color:#333}
  .plan li{margin:0 0 6px}
  .math{margin:6px 0 0; padding-left:0; list-style:none; font-size:11px; line-height:1.45; color:#333}
  .math li{margin:0 0 5px}
  .rulebox{border:1.5px solid #111; padding:7px 10px 4px; margin:0 0 12px; font-size:11px; line-height:1.4}
  .rulebox .rt{display:block; font-weight:700; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px}
  .rulebox ul{margin:0; padding-left:15px}
  .rulebox li{margin:0 0 4px}
  .slrow{display:flex; align-items:center; gap:8px; margin-top:6px}
  .slrow input{flex:1; accent-color:#111}
  .tiers{width:100%; border-collapse:collapse; font-size:10.5px; margin-top:4px}
  .tiers th{text-align:left; font-weight:400; color:#999; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:2px 4px; border-bottom:1px solid #ddd}
  .tiers td{padding:5px 4px; border-bottom:1px solid #eee; vertical-align:top}
  .tiers td small{color:#888}
  .tiers td.n{text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
  .tiers tr.off td{color:#aaa}
  .hexsc text{text-anchor:middle; dominant-baseline:central; font-weight:600; pointer-events:none}
  .needareas text{fill:#fff; font-weight:700; text-anchor:middle; dominant-baseline:central; pointer-events:none}
  .needlist{list-style:none; margin:6px 0 0; padding:0}
  .needlist li{display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid #eee; cursor:pointer; font-size:11.5px}
  .needlist li:hover{background:#f6f6f6}
  .needlist .nn{flex:none; width:20px; height:20px; border-radius:50%; background:#111; color:#fff; font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center}
  .needlist .nt{display:flex; flex-direction:column; gap:3px}
  .needlist .nb{display:flex; gap:2px; height:6px}
  .needlist .nb i{display:block; height:6px}
  .needlist .pb{display:flex; flex-direction:column; gap:2px; font-size:10px; color:#555}
  .needlist .pb span{display:flex; align-items:center; gap:6px}
  .needlist .pb i{display:inline-block; height:6px; min-width:1px}
  .needlist .cn{font-size:10px; color:#777; line-height:1.35}
  .needlist .cn em{font-style:normal; font-weight:700}
  #m-harlem svg{touch-action:none; cursor:grab}
  #m-harlem svg path, #m-harlem svg circle{vector-effect:non-scaling-stroke}
  .x2lbl text{pointer-events:none; paint-order:stroke; stroke:#fff; stroke-linejoin:round}
  .x2lbl .stl{font-size:calc(9px * var(--fz,1)); stroke-width:calc(2.5px * var(--fz,1)); fill:#555; text-anchor:middle; dominant-baseline:middle; letter-spacing:.03em}
  .zoombtns{position:absolute; right:6px; top:6px; display:flex; flex-direction:column; gap:0}
  .zoombtns button{width:26px; height:26px; border:1px solid #111; border-bottom:0; background:#fff; font:14px/1 "Helvetica Neue",Helvetica,Arial,sans-serif; cursor:pointer}
  .zoombtns button:last-child{border-bottom:1px solid #111}
  .zoombtns button:hover{background:#111; color:#fff}
  aside h3{margin-bottom:7px}
  aside h3:not(:first-child), #panel h3{margin-top:18px}
  aside .stat{padding:4px 0}
  aside .rank li{padding:3.5px 0}
  aside .lyr{padding:4px 0}
  aside .note{margin-top:14px; padding-top:9px}
  /* 05 Index: names flow into columns and shrink until everything fits the screen */
  .idxcols{height:100%; column-width:190px; column-gap:26px; column-fill:auto; overflow:hidden; font-size:var(--fs,11px)}
  .idxcols h4{break-after:avoid; font-size:.9em; letter-spacing:.08em; text-transform:uppercase; margin:0 0 .3em; font-weight:600;
    display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid #ccc; padding-bottom:.25em}
  .idxcols h4 span{color:var(--muted); font-weight:400}
  .idxcols ol{list-style:none; margin:0 0 1em; padding:0; line-height:1.25}
  .idxcols li{display:flex; gap:6px; padding:.12em 0; cursor:pointer; break-inside:avoid; white-space:nowrap}
  .idxcols li:hover{background:#f3f3f3}
  .idxcols li .t{overflow:hidden; text-overflow:ellipsis}
  .idxcols li .n{color:#bbb; font-size:.85em; min-width:1.9em; font-variant-numeric:tabular-nums}
  .idxcols li .r{margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums}
  .idxcols .grp{break-after:avoid; font-family:'Archivo Black',"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:1.15em;
    margin:0 0 .35em; padding-top:.1em; border-top:2px solid var(--ink)}
  .idxcols .more{font-size:.9em; color:var(--muted); margin:-.6em 0 1em}
  .idxgrid{grid-template-columns:1fr; gap:16px}
  footer{padding:6px 24px; font-size:10px}
  @media(max-width:900px){
    body{height:auto; overflow:auto}
    .maps{height:auto; flex-wrap:wrap}
    .mapcol{height:auto}
    .mapcol svg{height:auto}
    aside{overflow:visible}
  }
  .plabel{font-size:calc(10px * var(--k, 1)); stroke-width:calc(2.5px * var(--k, 1)) !important; fill:#1d5e2a; font-weight:600; paint-order:stroke; stroke:#fff; stroke-width:2.5px; pointer-events:none;
    letter-spacing:.02em}
</style>
</head>
<body>

<header>
  <h1>Atlas of Lingering</h1>
  <nav class="experiments" id="experiments" aria-label="Experiments">
    <button class="on" data-x="1">Experiment 1 <span>Central Harlem · Midtown</span></button>
    <button data-x="2">Experiment 2 <span>Central Harlem scaffolding</span></button>
  </nav>
  <p class="meta" id="hdrmeta"></p>
</header>

<nav id="tabs">
  <button data-t="0" class="on">01 &nbsp;All Places</button>
  <button data-t="1">02 &nbsp;By Layer</button>
  <button data-t="2">03 &nbsp;Compare</button>
  <button data-t="3">04 &nbsp;Formal / Informal</button>
  <button data-t="4">05 &nbsp;Affordances</button>
  <button data-t="5">06 &nbsp;Index</button>
  <button data-t="7" data-x="2" style="display:none">01 &nbsp;Linger Index</button>
  <button data-t="8" data-x="2" style="display:none">02 &nbsp;Need</button>
  <button data-t="9" data-x="2" style="display:none">03 &nbsp;Overlay</button>
  <button data-t="6" data-x="2" style="display:none">04 &nbsp;The Rule: Scaffolding</button>
  <button data-t="10" data-x="2" style="display:none">05 &nbsp;Hyper Scaffold: TOPS</button>
</nav>
<div class="subnav" id="subnav"></div>

<div class="wrap">
  <div class="stage">
    <p class="cap" id="cap" hidden></p>
    <div id="canvas"></div>
  </div>
  <aside>
    <div id="legendbox"></div>
    <div id="panel"></div>
    <p class="note" id="note"></p>
    <div class="index" id="index"></div>
  </aside>
</div>

<footer>
  Atlas of Lingering — Aqila Bakri &nbsp;·&nbsp;
  Data: NYC Open Data — benches, POPS, parks, DOB shed permits, PLUTO, bus shelters, Facilities DB, 311;
  NYS barbershop licences; OpenStreetMap laundromats; NYC Planning districts
</footer>

<div id="tip"></div>

<script src="data.js"></script>
<script>
(function(){
  const D = DATA;
  const HOODS = [
    { cd:110, key:"harlem",  name:"Central Harlem", short:"HAR" },
    { cd:105, key:"midtown", name:"Midtown",        short:"MID" }
  ];
  const hoodBy = {}; HOODS.forEach(h => hoodBy[h.cd] = h);

  // ---------- layers (point datasets) ----------
  const LAYERS = [
    { key:"sheds",   name:"Sidewalk sheds", color:"#c8102e", r:1.6, op:.55,
      tip:p => '<span class="k">Sidewalk shed</span><b>'+p[3]+'</b>'+nf(p[4])+' permit'+(p[4]>1?'s':'')+' on record'+(p[5]?' · '+p[5]+' renewal'+(p[5]>1?'s':''):''),
      label:p => p[3], rankVal:p => p[4], rankFmt:v => v+"×" },
    { key:"benches", name:"City benches", color:"#1f5fbf", r:3, op:.95,
      tip:p => '<span class="k">City bench</span><b>'+(p[3]||'Bench')+'</b>'+[p[4]&&p[4]+' bench',p[5],p[6]&&'installed '+p[6]].filter(Boolean).join('<br>'),
      label:p => p[3] || "Bench" },
    { key:"pops",    name:"Privately owned public spaces", color:"#7b3fb5", r:3.2, op:.95,
      tip:p => '<span class="k">POPS</span><b>'+p[3]+'</b>'+[p[4]!==p[3]&&p[4],p[5],p[6]&&'Open '+p[6],p[7]].filter(Boolean).join('<br>'),
      label:p => p[3] },
    { key:"parks",   name:"Parks & plazas", color:"#2e8b3d", r:3.2, op:.95,
      tip:p => '<span class="k">Park property</span><b>'+p[3]+'</b>'+[p[4],p[5]!=null&&p[5]+' acres',p[6]].filter(Boolean).join('<br>'),
      label:p => p[3], rankVal:p => p[5], rankFmt:v => (v==null?'—':v+' ac') }
  ];
  // ---------- 06 Conditions layers ----------
  const C = D.cond;
  const CLAYERS = [
    { key:"stoop_hi", name:"Likely high stoop", sub:"row house, 1–3 family", color:"#7a5236", r:2.4, op:.9,
      data:C.stoops.filter(p => p[8]==="high"),
      tip:p => '<span class="k">Likely high stoop · row house</span><b>'+p[3]+'</b>Class '+p[4]+' · built '+p[5]+'<br>'+p[6]+' floors · '+p[7]+' ft lot front'+(p[9]?'<br>'+p[9]:''),
      label:p => p[3] },
    { key:"stoop_lo", name:"Likely low stoop", sub:"walk-up tenement", color:"#c99a6b", r:2.2, op:.9,
      data:C.stoops.filter(p => p[8]==="low"),
      tip:p => '<span class="k">Likely low stoop · walk-up tenement</span><b>'+p[3]+'</b>Class '+p[4]+' · built '+p[5]+'<br>'+p[6]+' floors · '+p[7]+' ft lot front'+(p[9]?'<br>'+p[9]:''),
      label:p => p[3] },
    { key:"shelters", name:"Bus stop shelters", color:"#0c8599", r:3.4, op:.95, data:C.shelters,
      tip:p => '<span class="k">Bus stop shelter</span><b>'+p[3]+'</b>'+(p[4]?p[4]+' corner · ':'')+p[5], label:p => p[3] },
    { key:"vendors", name:"Food vendor spots", sub:"311 complaints, past year", color:"#e8590c", op:.8,
      r:3, rf:p => 2 + Math.sqrt(p[4])*1.1, data:C.vendors,
      tip:p => '<span class="k">Food vendor spot · 311</span><b>'+p[3]+'</b>'+p[4]+' complaint'+(p[4]>1?'s':'')+' in the past year<br>latest '+p[5], label:p => p[3] },
    { key:"libraries", name:"Libraries", color:"#364fc7", r:4, op:.95, data:C.libraries,
      tip:p => '<span class="k">'+p[5]+'</span><b>'+p[3]+'</b>'+p[4], label:p => p[3] },
    { key:"laundromats", name:"Laundromats", sub:"OpenStreetMap", color:"#15aabf", r:3.6, op:.95, data:C.laundromats,
      tip:p => '<span class="k">Laundromat · OpenStreetMap</span><b>'+p[3]+'</b>'+[p[4],p[5]].filter(Boolean).join(' · '), label:p => p[3] },
    { key:"barbers", name:"Barbershops", sub:"NYS licences", color:"#d6336c", r:3.2, op:.95, data:C.barbers,
      tip:p => '<span class="k">Barbershop</span><b>'+p[3]+'</b>'+[p[4],p[5]].filter(Boolean).join('<br>'), label:p => p[3] }
  ];
  const ALL_LAYERS = {}; [...LAYERS, ...CLAYERS].forEach(L => ALL_LAYERS[L.key] = L);
  const SHORT = { sheds:["shed","sheds"], benches:["bench","benches"], pops:["POPS","POPS"], parks:["park","parks"],
    stoop_hi:["high stoop","high stoops"], stoop_lo:["low stoop","low stoops"], shelters:["bus shelter","bus shelters"],
    vendors:["vendor spot","vendor spots"], libraries:["library","libraries"], laundromats:["laundromat","laundromats"],
    barbers:["barbershop","barbershops"] };
  const nameN = (k, n) => n+' '+SHORT[k][n===1?0:1];
  ALL_LAYERS.sheds.rankTitle = "Most shed permits"; ALL_LAYERS.parks.rankTitle = "Largest";
  Object.assign(ALL_LAYERS.vendors, { rankVal:p => p[4], rankFmt:v => v+"×", rankTitle:"Most complaints" });
  const dataOf = L => L.data || D.layers[L.key];
  const cnt = (L, cd) => dataOf(L).filter(p => p[2]===cd).length;
  const on = {}; [...LAYERS, ...CLAYERS].forEach(l => on[l.key] = true);

  // ---------- helpers ----------
  const nf = n => (+n).toLocaleString("en-US");
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const count = (k, cd) => D.layers[k].filter(p => p[2]===cd).length;

  // ---------- projection: one shared scale so the two neighborhoods compare 1:1 ----------
  const LAT0 = 40.79, K = Math.cos(LAT0*Math.PI/180);
  const geoBy = {}; D.geo.forEach(g => geoBy[g.cd] = g);
  const PADF = 0.06;
  HOODS.forEach(h => {
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    geoBy[h.cd].rings.forEach(r => r.forEach(p => {
      const x=p[0]*K, y=-p[1];
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }));
    const pw=(x1-x0)*PADF, ph=(y1-y0)*PADF;
    h.bx = [x0-pw, y0-ph, x1+pw, y1+ph];
  });
  const maxH = Math.max(...HOODS.map(h => h.bx[3]-h.bx[1]));
  const SC = 760 / maxH;  // drawing units per projected degree
  HOODS.forEach(h => {
    h.W = (h.bx[2]-h.bx[0])*SC; h.H = (h.bx[3]-h.bx[1])*SC;
    h.px = lon => (lon*K - h.bx[0])*SC;
    h.py = lat => (-lat - h.bx[1])*SC;
    h.area = polyArea(geoBy[h.cd].rings[0]);
  });
  function polyArea(ring){ // square miles, planar approximation
    let a=0; const mx=69.17*K, my=69.0;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      a += (ring[j][0]*mx)*(ring[i][1]*my) - (ring[i][0]*mx)*(ring[j][1]*my);
    }
    return Math.abs(a/2);
  }
  const path = (h, ring) => "M"+ring.map(p => h.px(p[0]).toFixed(1)+","+h.py(p[1]).toFixed(1)).join("L")+"Z";

  // ---------- tooltip ----------
  const tip = document.getElementById("tip");
  function showTip(e, html){
    tip.innerHTML = html; tip.style.opacity = 1;
    const r = tip.getBoundingClientRect();
    let x = e.clientX+14, y = e.clientY+14;
    if(x+r.width > innerWidth-10) x = e.clientX-r.width-14;
    if(y+r.height > innerHeight-10) y = e.clientY-r.height-14;
    tip.style.left = x+"px"; tip.style.top = y+"px";
  }
  const hideTip = () => tip.style.opacity = 0;

  // ---------- map drawing ----------
  let views = []; // per hood: {h, svg, pts:[{L,p,x,y}], grid}
  function drawMaps(layerKeys){
    const canvas = document.getElementById("canvas");
    canvas.innerHTML = '<div class="maps">'+HOODS.map(h =>
      '<div class="mapcol"><h2>'+h.name+'<span>CD '+h.cd+' · '+h.area.toFixed(2)+' sq mi</span></h2><div id="m-'+h.key+'"></div></div>'
    ).join("")+'</div>';
    views = HOODS.map(h => {
      // drawing units per screen pixel, so labels stay a readable size however small the map is drawn
      const box = document.getElementById("m-"+h.key).getBoundingClientRect();
      const shown = Math.min(box.height || h.H, (box.width || h.W) * h.H / h.W);
      const k = Math.max(1, h.H / shown);
      let s = '<svg viewBox="0 0 '+h.W.toFixed(0)+' '+h.H.toFixed(0)+'" role="img" style="--k:'+k.toFixed(3)+'">';
      s += '<defs><clipPath id="clip-'+h.key+'"><path d="'+path(h, geoBy[h.cd].rings[0])+'"/></clipPath></defs>';
      // neighbors, faint
      D.geo.forEach(g => { if(g.cd!==h.cd) g.rings.forEach(r => s += '<path d="'+path(h,r)+'" fill="#fbfbfb" stroke="#cfcfcf" stroke-width=".5"/>'); });
      // focus district
      s += '<path d="'+path(h, geoBy[h.cd].rings[0])+'" fill="var(--base-fill)" stroke="none"/>';
      // parks as shapes (context for the park points)
      if(layerKeys.includes("parks")){
        s += '<g fill="#cfe8c9" stroke="#7fb27a" stroke-width=".4" clip-path="url(#clip-'+h.key+')">';
        D.park_shapes.forEach(ps => ps.forEach(r => s += '<path d="'+path(h,r)+'"/>'));
        s += '</g>';
      }
      s += '<path d="'+path(h, geoBy[h.cd].rings[0])+'" fill="none" stroke="#111" stroke-width="1.1"/>';
      const pts = [];
      layerKeys.map(key => ALL_LAYERS[key]).filter(Boolean).forEach(L => {
        s += '<g data-l="'+L.key+'" fill="'+L.color+'" fill-opacity="'+L.op+'"'+(L.r>2?' stroke="#fff" stroke-width=".6"':'')+(on[L.key]?'':' style="display:none"')+'>';
        dataOf(L).forEach(p => {
          if(p[2]!==h.cd) return;
          const x = h.px(p[0]), y = h.py(p[1]);
          s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+((L.rf?L.rf(p):L.r)*Math.sqrt(k)).toFixed(2)+'"/>';
          pts.push({L, p, x, y});
        });
        s += '</g>';
      });
      // park labels for the larger parks
      if(layerKeys.includes("parks") && on.parks){
        const placed = [];
        D.layers.parks.filter(p => p[2]===h.cd && p[5]>=1.2).sort((a,b) => b[5]-a[5]).forEach(p => {
          const x = h.px(p[0]), y = h.py(p[1]), right = x > h.W*0.62;   // flip labels near the right edge so they stay on the map
          if(placed.some(q => Math.abs(q[1]-y) < 12*k && Math.abs(q[0]-x) < 150*k)) return;   // larger park wins a collision
          placed.push([x,y]);
          s += '<text class="plabel" x="'+(right?x-5*k:x+5*k).toFixed(1)+'" y="'+(h.py(p[1])+3).toFixed(1)+'"'+(right?' text-anchor="end"':'')+'>'+esc(p[3])+'</text>';
        });
      }
      s += '<circle class="hl" r="'+(6*k).toFixed(1)+'" fill="none" stroke="#111" stroke-width="'+(1.6*k).toFixed(1)+'" opacity="0"/>';
      s += '</svg>';
      document.getElementById("m-"+h.key).innerHTML = s;
      const svg = document.querySelector("#m-"+h.key+" svg");
      const v = { h, svg, pts, hl: svg.querySelector(".hl") };
      buildGrid(v); bindHover(v);
      return v;
    });
  }
  function buildGrid(v){
    const CELL = 14; v.grid = {}; v.CELL = CELL;
    v.pts.forEach((q,i) => {
      if(!on[q.L.key]) return;
      const k = Math.floor(q.x/CELL)+":"+Math.floor(q.y/CELL);
      (v.grid[k] || (v.grid[k] = [])).push(i);
    });
  }
  function bindHover(v){
    v.svg.addEventListener("mousemove", e => {
      const pt = v.svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
      const loc = pt.matrixTransform(v.svg.getScreenCTM().inverse());
      const gx = Math.floor(loc.x/v.CELL), gy = Math.floor(loc.y/v.CELL);
      const kk = (v.h.H / (v.svg.getBoundingClientRect().height || v.h.H))**2;
      let best=-1, bd=100*Math.max(1,kk);
      for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
        const cell = v.grid[(gx+dx)+":"+(gy+dy)]; if(!cell) continue;
        for(const i of cell){
          const q=v.pts[i];
          // small points lose ties to the larger, rarer ones
          const d = (q.x-loc.x)**2 + (q.y-loc.y)**2 - (q.L.r>2?12:0);
          if(d<bd){ bd=d; best=i; }
        }
      }
      if(best<0){ v.hl.setAttribute("opacity",0); hideTip(); return; }
      const q = v.pts[best];
      v.hl.setAttribute("cx",q.x); v.hl.setAttribute("cy",q.y); v.hl.setAttribute("opacity",1);
      showTip(e, q.L.tip(q.p.map(x => typeof x==="string"?esc(x):x)));
    });
    v.svg.addEventListener("mouseleave", () => { v.hl.setAttribute("opacity",0); hideTip(); });
  }
  function flash(L, p){
    const v = views.find(v => v.h.cd===p[2]); if(!v) return;
    const x=v.h.px(p[0]), y=v.h.py(p[1]);
    v.hl.setAttribute("cx",x); v.hl.setAttribute("cy",y); v.hl.setAttribute("opacity",1);
    const r = v.svg.getBoundingClientRect(), ctm = v.svg.getScreenCTM();
    showTip({clientX: ctm.a*x+ctm.e, clientY: ctm.d*y+ctm.f}, L.tip(p.map(x => typeof x==="string"?esc(x):x)));
    clearTimeout(flash.t); flash.t = setTimeout(() => { hideTip(); v.hl.setAttribute("opacity",0); }, 3500);
  }

  // ---------- sidebar ----------
  function layerToggles(keys){
    return '<h3>Layers</h3><div class="colhd"><span></span><span></span><span>Har</span><span>Mid</span></div>'+
      LAYERS.filter(L => keys.includes(L.key)).map(L =>
        '<label class="lyr"><input type="checkbox" data-k="'+L.key+'"'+(on[L.key]?' checked':'')+'>'+
        '<span class="nm"><span class="sw" style="background:'+L.color+'"></span>'+L.name+'</span>'+
        '<span class="vl">'+nf(count(L.key,110))+'</span><span class="vl">'+nf(count(L.key,105))+'</span></label>'
      ).join("");
  }
  function bindToggles(){
    document.querySelectorAll(".lyr input").forEach(cb => cb.onchange = () => {
      on[cb.dataset.k] = cb.checked;
      views.forEach(v => {
        const g = v.svg.querySelector('g[data-l="'+cb.dataset.k+'"]');
        if(g) g.style.display = cb.checked ? "" : "none";
        v.svg.querySelectorAll(".plabel").forEach(t => t.style.display = on.parks ? "" : "none");
        buildGrid(v);
      });
      renderIndex(curKeys);
    });
  }
  function stat(k,v){ return '<div class="stat"><span>'+k+'</span><b>'+v+'</b></div>'; }

  // ---------- index of places ----------
  let curKeys = [];
  function renderIndex(){ document.getElementById("index").innerHTML = ""; }   // the index now lives in tab 05

  // ---------- 05 Index: every named place in one neighborhood, sized to fit the screen ----------
  // every layer, grouped by affordance; long lists are capped and point to the map
  const IDX_GROUPS = [
    ["Sit",            ["stoop_hi","stoop_lo","benches"]],
    ["Shelter",        ["shelters","sheds"]],
    ["Social magnets", ["vendors","libraries","laundromats","barbers"]],
    ["Open space",     ["parks","pops"]]
  ];
  const IDX_CAP = { sheds:15, stoop_hi:12, stoop_lo:8, vendors:15, shelters:20 };
  const IDX_SORT = {   // how each list is ordered, and what the right-hand column shows
    stoop_hi: { by:p => -p[5], fmt:p => p[5], what:"oldest" },
    stoop_lo: { by:p => -p[5], fmt:p => p[5], what:"oldest" }
  };
  const BYLAYER_SUB = { sheds:0, benches:1, pops:2, parks:3, stoop_hi:4, stoop_lo:4, shelters:5, vendors:6, libraries:7, laundromats:8, barbers:9 };
  function renderIndexTab(hoodKey){
    const h = HOODS.find(h => h.key===hoodKey);
    curKeys = []; views = [];
    const build = scale => {
    let s = '<div class="idxcols" id="idxcols">';
    IDX_GROUPS.forEach(([gname, keys]) => {
      s += '<div class="grp">'+gname+'</div>';
      keys.forEach(k => {
        const L = ALL_LAYERS[k], arr = dataOf(L);
        let items = arr.filter(p => p[2]===h.cd);
        const total = items.length, srt = IDX_SORT[k];
        s += '<h4><span style="color:var(--ink)"><span class="sw" style="background:'+L.color+'"></span>'+L.name+'</span><span>'+nf(total)+'</span></h4>';
        if(!total){ s += '<div class="more" style="margin:0 0 1em">None recorded in '+h.name+'.</div>'; return; }
        if(srt) items = items.slice().sort((a,b) => srt.by(b)-srt.by(a));
        else if(L.rankVal) items = items.slice().sort((a,b) => (L.rankVal(b)||0)-(L.rankVal(a)||0));
        else items = items.slice().sort((a,b) => String(L.label(a)).localeCompare(String(L.label(b))));
        const cap = Math.min(total, Math.max(5, Math.round((IDX_CAP[k] || total) * scale)));
        const right = p => srt ? srt.fmt(p) : (L.rankVal ? L.rankFmt(L.rankVal(p)) : '');
        s += '<ol>'+items.slice(0,cap).map((p,i) =>
          '<li data-l="'+k+'" data-i="'+arr.indexOf(p)+'" title="'+esc(L.label(p))+'"><span class="n">'+String(i+1).padStart(2,"0")+'</span>'+
          '<span class="t">'+esc(L.label(p))+'</span>'+(right(p)!==''?'<span class="r">'+right(p)+'</span>':'')+'</li>').join("")+'</ol>';
        if(total>cap) s += '<div class="more">'+(srt?'The '+cap+' '+srt.what:'Top '+cap+(L.rankTitle?' · '+L.rankTitle.toLowerCase():''))+' · '+nf(total-cap)+' more on the map</div>';
      });
    });
    s += '</div>';
    return s; };
    // shrink the type until every column fits; if even the smallest type overflows, trim the long lists and try again
    const MIN_FS = 8;
    let el, scale = 1;
    const over = () => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1;
    for(let tries = 0; tries < 12; tries++){
      document.getElementById("canvas").innerHTML = build(scale);
      el = document.getElementById("idxcols");
      let fs = 12.5; el.style.setProperty("--fs", fs+"px");
      while(fs > MIN_FS && over()){ fs -= .25; el.style.setProperty("--fs", fs+"px"); }
      if(!over()) break;
      scale *= .8;
    }
    el.querySelectorAll("li[data-l]").forEach(li => li.onclick = () => {
      const L = ALL_LAYERS[li.dataset.l], p = dataOf(L)[+li.dataset.i];
      goTo(1, BYLAYER_SUB[L.key]); flash(L, p);     // jump to that layer's map and point the place out
    });
    document.getElementById("legendbox").innerHTML =
      '<h3>'+h.name+'</h3>'+IDX_GROUPS.map(([g, keys]) =>
        '<div style="font-weight:600;font-size:10.5px;margin:8px 0 2px;text-transform:uppercase;letter-spacing:.06em">'+g+'</div>'+
        keys.map(k => ALL_LAYERS[k]).map(L => stat('<span class="sw" style="background:'+L.color+'"></span>'+L.name, nf(cnt(L,h.cd)))).join("")).join("")+
      stat("District area", h.area.toFixed(2)+" sq mi");
    document.getElementById("panel").innerHTML = "";
  }

  // ---------- views ----------
  // draw order for All Places: small, numerous dots underneath, rarer places on top
  const ALL_ORDER = ["sheds","stoop_lo","stoop_hi","vendors","shelters","benches","laundromats","barbers","libraries","pops","parks"];
  function renderAll(){
    curKeys = ALL_ORDER.slice();
    drawMaps(curKeys);
    document.getElementById("legendbox").innerHTML = IDX_GROUPS.map(([g, keys]) =>
      '<h3>'+g+'</h3>'+condToggles(keys).replace(/<div class="colhd">.*?<\/div>/, g==="Sit" ? '$&' : '')).join("");
    document.getElementById("panel").innerHTML = "";
    bindToggles();
  }
  function renderLayer(keysIn, title){
    const keys = Array.isArray(keysIn) ? keysIn : [keysIn];
    const Ls = keys.map(k => ALL_LAYERS[k]);
    keys.forEach(k => on[k] = true); curKeys = keys;
    drawMaps(keys);
    const tot = cd => Ls.reduce((a,L) => a+cnt(L,cd), 0);
    document.getElementById("legendbox").innerHTML =
      '<h3>'+(title || Ls[0].name)+'</h3>'+(keys.length>1 ? condToggles(keys) : '')+
      HOODS.map(h => stat(h.name, nf(tot(h.cd)))).join("")+
      HOODS.map(h => stat(h.name+' per sq mi', (tot(h.cd)/h.area).toFixed(1))).join("");
    let rank = "";
    const L = Ls[0];
    if(Ls.length===1 && L.rankVal){
      const arr = dataOf(L);
      const top = arr.slice().sort((a,b) => (L.rankVal(b)||0)-(L.rankVal(a)||0)).slice(0,10);
      rank = '<h3>'+(L.rankTitle||"Top 10")+'</h3><ul class="rank">'+top.map((p,i) =>
        '<li data-i="'+arr.indexOf(p)+'"><span class="nm"><span class="i">'+String(i+1).padStart(2,"0")+'</span>'+esc(L.label(p))+
        ' <span style="color:#aaa">'+hoodBy[p[2]].short+'</span></span><span class="vl">'+L.rankFmt(L.rankVal(p))+'</span></li>').join("")+'</ul>';
    }
    document.getElementById("panel").innerHTML = rank;
    document.querySelectorAll("#panel .rank li").forEach(li => li.onclick = () => flash(L, dataOf(L)[+li.dataset.i]));
    if(keys.length>1) bindToggles();
  }
  function renderCompare(mode){
    curKeys = [];
    document.getElementById("index").innerHTML = "";
    const val = (L,h) => mode==="density" ? cnt(L,h.cd)/h.area : cnt(L,h.cd);
    const fmt = v => mode==="density" ? v.toFixed(1) : nf(v);
    let s = '<div class="bars" id="bars"><div class="key">'+
      '<span><i style="background:#111"></i>Central Harlem</span><span><i style="background:#bbb"></i>Midtown</span>'+
      '<span style="margin-left:auto">'+(mode==="density"?"per square mile":"count")+' · each row scaled to its larger value</span></div>';
    IDX_GROUPS.forEach(([g, keys]) => {
      s += '<div class="bgrp">'+g+'</div>';
      keys.map(k => ALL_LAYERS[k]).forEach(L => {
        const a = val(L,HOODS[0]), b = val(L,HOODS[1]), mx = Math.max(a,b)||1;
        s += '<div class="row"><span><span class="sw" style="background:'+L.color+'"></span>'+L.name+'</span>'+
          '<div class="track"><div class="b" style="width:'+(a/mx*100)+'%;background:#111"></div><div class="b" style="width:'+(b/mx*100)+'%;background:#bbb"></div></div>'+
          '<div class="v">'+fmt(a)+'<br>'+fmt(b)+'</div></div>';
      });
    });
    s += '</div>';
    document.getElementById("canvas").innerHTML = s;
    // shrink to fit the stage if needed
    const el = document.getElementById("bars"), box = document.getElementById("canvas");
    let z = 1; el.style.zoom = 1;
    while(z > .6 && el.scrollHeight*z > box.clientHeight){ z -= .02; el.style.zoom = z; }
    document.getElementById("legendbox").innerHTML =
      '<h3>District area</h3>'+HOODS.map(h => stat(h.name, h.area.toFixed(2)+' sq mi')).join("");
    const ratio = L => { const a=cnt(L,110)/HOODS[0].area, b=cnt(L,105)/HOODS[1].area; return b ? (a/b).toFixed(2)+'×' : (a ? 'Harlem only' : '—'); };
    document.getElementById("panel").innerHTML =
      '<h3>Harlem relative to Midtown</h3>'+IDX_GROUPS.flatMap(([g,keys]) => keys).map(k => ALL_LAYERS[k]).map(L =>
        stat('<span class="sw" style="background:'+L.color+'"></span>'+L.name, ratio(L))).join("")+
      '<p class="note" style="margin-top:8px;border:0;padding:0">Per-square-mile density in Central Harlem divided by Midtown. Above 1× means more per square mile in Harlem.</p>';
    views = [];
  }

  function renderFormalCompare(){
    curKeys = [];
    const sum = (keys, cd) => keys.reduce((a,k) => a+cnt(ALL_LAYERS[k],cd), 0);
    const NOSHED = INFORMAL.filter(k => k!=="sheds");
    const ROWS = [["Formal", FORMAL, "designed for pausing"], ["Informal", INFORMAL, "lingering happens anyway"], ["Informal without sheds", NOSHED, "stoops, vendors, laundromats, barbers"]];
    const bar = (label, sub, a, b, fmt) => { const mx = Math.max(a,b)||1;
      return '<div class="row"><span>'+label+'<br><span style="color:#999;font-size:10px">'+sub+'</span></span>'+
        '<div class="track"><div class="b" style="width:'+(a/mx*100)+'%;background:#111"></div><div class="b" style="width:'+(b/mx*100)+'%;background:#bbb"></div></div>'+
        '<div class="v">'+fmt(a)+'<br>'+fmt(b)+'</div></div>'; };
    // composition: one stacked bar per district and class, coloured by dataset
    const stack = (keys, h) => { const t = sum(keys,h.cd)||1;
      return '<div style="display:flex;height:14px;margin:2px 0 6px;border:1px solid #ddd">'+keys.map(k => { const L = ALL_LAYERS[k], v = cnt(L,h.cd);
        return v ? '<div title="'+L.name+': '+nf(v)+'" style="width:'+(v/t*100)+'%;background:'+L.color+'"></div>' : ''; }).join("")+'</div>'; };
    let s = '<div class="bars" id="bars"><div class="key"><span><i style="background:#111"></i>Central Harlem</span><span><i style="background:#bbb"></i>Midtown</span>'+
      '<span style="margin-left:auto">each row scaled to its larger value</span></div>';
    s += '<div class="bgrp">Count</div>'+ROWS.map(([n,k,sub]) => bar(n, sub, sum(k,110), sum(k,105), nf)).join("");
    s += '<div class="bgrp">Per square mile</div>'+ROWS.map(([n,k,sub]) => bar(n, sub, sum(k,110)/HOODS[0].area, sum(k,105)/HOODS[1].area, v => v.toFixed(0))).join("");
    s += '<div class="bgrp">What each side is made of</div><div style="display:grid;grid-template-columns:150px 1fr 1fr;gap:4px 16px;font-size:11px;align-items:center">'+
      '<span></span><b style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#666">Formal</b><b style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#666">Informal</b>'+
      HOODS.map(h => '<span>'+h.name+'</span><div>'+stack(FORMAL,h)+'</div><div>'+stack(INFORMAL,h)+'</div>').join("")+'</div>';
    s += '</div>';
    document.getElementById("canvas").innerHTML = s;
    const el = document.getElementById("bars"), box = document.getElementById("canvas");
    let z = 1; el.style.zoom = 1;
    while(z > .6 && el.scrollHeight*z > box.clientHeight){ z -= .02; el.style.zoom = z; }
    const leg = (title, keys) => '<h3>'+title+'</h3><div class="colhd"><span></span><span></span><span>Har</span><span>Mid</span></div>'+
      keys.map(k => ALL_LAYERS[k]).map(L => '<div class="lyr" style="cursor:default"><span></span><span class="nm"><span class="sw" style="background:'+L.color+'"></span>'+L.name+'</span>'+
        '<span class="vl">'+nf(cnt(L,110))+'</span><span class="vl">'+nf(cnt(L,105))+'</span></div>').join("");
    document.getElementById("legendbox").innerHTML = leg("Formal", FORMAL) + leg("Informal", INFORMAL);
    const r = (k1,k2,cd) => (sum(k2,cd)/(sum(k1,cd)||1)).toFixed(1)+' : 1';
    document.getElementById("panel").innerHTML = '<h3>Informal places per formal place</h3>'+
      HOODS.map(h => stat(h.name, r(FORMAL,INFORMAL,h.cd))).join("")+
      HOODS.map(h => stat(h.name+', without sheds', r(FORMAL,NOSHED,h.cd))).join("");
    views = [];
  }

  // ---------- Process II: honeycomb (hexbin) maps ----------
  const RAMPS = {
    greens: ["#f7fcf5","#e5f5e0","#c7e9c0","#a1d99b","#74c476","#41ab5d","#238b45","#006d2c","#00441b"],
    reds:   ["#fff5f0","#fee0d2","#fcbba1","#fc9272","#fb6a4a","#ef3b2c","#cb181d","#a50f15","#67000d"],
    browns: ["#fbf6f0","#f1e3d1","#e3c9a8","#d1a97c","#b98a58","#9a6c3e","#7a5236","#5c3c26","#3d2717"],
    teals:  ["#f1fafa","#d4eff0","#ade0e3","#7ccbd0","#4bb2ba","#2596a0","#0c8599","#09687a","#064b59"],
    oranges:["#fff5eb","#fee6ce","#fdd0a2","#fdae6b","#fd8d3c","#f16913","#d94801","#a63603","#7f2704"],
    blues:  ["#f7fbff","#deebf7","#c6dbef","#9ecae1","#6baed6","#4292c6","#2171b5","#08519c","#08306b"],
    purples:["#fcfbfd","#efedf5","#dadaeb","#bcbddc","#9e9ac8","#807dba","#6a51a3","#54278f","#3f007d"]
  };
  function hexc(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  function ramp(name, t){
    const c = RAMPS[name]; t = Math.max(0, Math.min(1, t));
    const i = Math.min(c.length-2, Math.floor(t*(c.length-1))), f = t*(c.length-1)-i;
    const a = hexc(c[i]), b = hexc(c[i+1]);
    return "rgb("+Math.round(a[0]+(b[0]-a[0])*f)+","+Math.round(a[1]+(b[1]-a[1])*f)+","+Math.round(a[2]+(b[2]-a[2])*f)+")";
  }
  const HEX_M = 120;                                   // hexagon radius in metres
  const HR = HEX_M / 111320 * SC;                      // ...in drawing units (1° lat ≈ 111.3 km)
  // formal / informal split (by design intent): was the place built for people to pause?
  const FORMAL   = ["parks","pops","benches","shelters","libraries"];
  const INFORMAL = ["stoop_hi","stoop_lo","sheds","vendors","laundromats","barbers"];
  const HEXSETS = {
    a_sit:     { keys:["stoop_hi","stoop_lo","benches"], ramp:"browns", name:"Sit", cap:"",
      note:"Likely stoops (estimated from PLUTO: row houses and walk-up tenements built by 1915) plus city benches, counted per hexagon. Harlem's estimated sitting area is about 1,800 m² against Midtown's 60 m² (mid estimates; see 02 By Layer → Stoops for the assumptions)." },
    a_shelter: { keys:["shelters","sheds"], ramp:"teals", name:"Shelter", cap:"",
      note:"Bus stop shelters plus buildings with a sidewalk shed permit on record, per hexagon. Sheds dominate the count: they are the city's largest, and least intended, source of overhead cover." },
    a_social:  { keys:["vendors","libraries","laundromats","barbers"], ramp:"oranges", name:"Social magnets", cap:"",
      note:"Food vendor spots (311 complaints), libraries, laundromats (OpenStreetMap) and barbershops (NYS licences), per hexagon. Laundromats are undercounted, so treat Harlem's cells as a floor." },
    a_unpaid:  { keys:["pops","stoop_hi","stoop_lo"], ramp:"greens", name:"Permission · unpaid", cap:"",
      note:"Places you may stay without buying anything: POPS are open to the public by zoning law; stoops are private steps that are customarily shared. Harlem's unpaid places are almost all stoops, Midtown's almost all POPS — legal permission versus customary permission." },
    a_open:    { keys:["parks","benches","shelters","libraries","sheds"], ramp:"blues", name:"Permission · open", cap:"",
      note:"Everything else: public places open to anyone, where no one's permission or purchase is needed — parks & plazas, city benches, bus shelters, libraries and the sidewalk under sheds. Food vendor spots are left out because buying is expected there." },
    a_paid:    { keys:["barbers","laundromats"], ramp:"purples", name:"Permission · paid", cap:"",
      note:"Places where staying is tied to being a customer: you linger at the barbershop or laundromat because you are paying for a service. Each permission map has its own colour scale, because unpaid places far outnumber paid ones." },
    formal:   { keys:FORMAL, ramp:"greens", name:"Formal", cap:"",
      note:"Formal = places designed for people to pause: parks & plazas, POPS, city benches, bus shelters and libraries. Every hexagon is the same size in both districts and both maps share one colour scale, so cells compare directly." },
    informal: { keys:INFORMAL, ramp:"reds", name:"Informal", cap:"",
      note:"Informal = places where lingering happens anyway, though they were built for something else: stoops, sidewalk sheds, food vendor spots, laundromats and barbershops. Sheds and stoops make up most of the count." }
  };
  function hexKey(x, y){                               // pointy-top axial rounding
    const q = (Math.sqrt(3)/3*x - y/3)/HR, r = (2/3*y)/HR;
    let rx=Math.round(q), ry=Math.round(-q-r), rz=Math.round(r);
    const dx=Math.abs(rx-q), dy=Math.abs(ry+q+r), dz=Math.abs(rz-r);
    if(dx>dy && dx>dz) rx=-ry-rz; else if(dy>dz) ry=-rx-rz; else rz=-rx-ry;
    return [rx, rz];
  }
  const hexCenter = (q, r) => [HR*Math.sqrt(3)*(q + r/2), HR*1.5*r];
  function hexPath(cx, cy){
    let s = "M";
    for(let i=0;i<6;i++){ const a = Math.PI/180*(60*i-30); s += (cx+HR*Math.cos(a)).toFixed(1)+","+(cy+HR*Math.sin(a)).toFixed(1)+(i<5?"L":""); }
    return s+"Z";
  }
  function inRing(x, y, ring){
    let ins=false;
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
      if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins;
    }
    return ins;
  }
  // legend listing each dataset in a view, with its colour and the count in each district
  function datasetsLegend(keys){
    return '<h3>Datasets included</h3><div class="colhd"><span></span><span></span><span>Har</span><span>Mid</span></div>'+
      keys.map(k => ALL_LAYERS[k]).map(L =>
        '<div class="lyr" style="cursor:default"><span></span><span class="nm"><span class="sw" style="background:'+L.color+'"></span>'+L.name+
        (L.sub?' <span style="color:#999">· '+L.sub+'</span>':'')+'</span><span class="vl">'+nf(cnt(L,110))+'</span><span class="vl">'+nf(cnt(L,105))+'</span></div>').join("");
  }
  // points twin of a honeycomb: same datasets as dots, with the same legend (as toggles)
  function renderHexPoints(setKey){
    const H = HEXSETS[setKey];
    renderLayer(H.keys, H.name+' — location map');
    const lb = document.getElementById("legendbox");
    if(H.keys.length===1) lb.innerHTML = datasetsLegend(H.keys) + lb.innerHTML.replace(/^<h3>.*?<\/h3>/, '<h3>'+H.name+' — location map</h3>');
    else lb.innerHTML = lb.innerHTML.replace(/^<h3>(.*?)<\/h3>/, '<h3>$1</h3><div style="font-size:10px;color:#999;letter-spacing:.06em;text-transform:uppercase;margin:-4px 0 4px">Datasets included</div>');
  }
  function renderHex(setKey){
    const H = HEXSETS[setKey]; curKeys = [];
    document.getElementById("index").innerHTML = "";
    // bin every hood first so both maps share one scale
    const bins = HOODS.map(h => {
      const ring = geoBy[h.cd].rings[0].map(p => [h.px(p[0]), h.py(p[1])]);
      const cells = {};
      // grid of cells whose centre falls inside the district
      const qMax = Math.ceil(h.W/(HR*Math.sqrt(3)))+2, rMax = Math.ceil(h.H/(HR*1.5))+2;
      for(let r=-2;r<=rMax;r++) for(let q=-Math.ceil(rMax/2)-2;q<=qMax;q++){
        const [cx,cy] = hexCenter(q,r);
        if(inRing(cx,cy,ring)) cells[q+":"+r] = {q,r,cx,cy,n:0,by:{}};
      }
      H.keys.forEach(k => dataOf(ALL_LAYERS[k]).forEach(p => {
        if(p[2]!==h.cd) return;
        const [q,r] = hexKey(h.px(p[0]), h.py(p[1])), id = q+":"+r;
        if(!cells[id]){ const [cx,cy]=hexCenter(q,r); cells[id] = {q,r,cx,cy,n:0,by:{}}; }
        cells[id].n++; cells[id].by[k] = (cells[id].by[k]||0)+1;
      }));
      return { h, ring, cells:Object.values(cells) };
    });
    const max = Math.max(1, ...bins.flatMap(b => b.cells.map(c => c.n)));
    const canvas = document.getElementById("canvas");
    canvas.innerHTML = '<div class="maps">'+bins.map(b =>
      '<div class="mapcol"><h2>'+b.h.name+' — '+H.name+'<span>'+nf(b.cells.reduce((a,c)=>a+c.n,0))+' places</span></h2><div id="x-'+b.h.key+'"></div></div>'
    ).join("")+'</div>';
    bins.forEach(b => {
      const h = b.h;
      let s = '<svg viewBox="0 0 '+h.W.toFixed(0)+' '+h.H.toFixed(0)+'" role="img">';
      s += '<defs><clipPath id="hc-'+h.key+'"><path d="'+path(h, geoBy[h.cd].rings[0])+'"/></clipPath></defs>';
      D.geo.forEach(g => { if(g.cd!==h.cd) g.rings.forEach(r => s += '<path d="'+path(h,r)+'" fill="#fbfbfb" stroke="#cfcfcf" stroke-width=".5"/>'); });
      s += '<g clip-path="url(#hc-'+h.key+')">';
      b.cells.forEach((c,i) => {
        const fill = c.n ? ramp(H.ramp, .15 + .85*c.n/max) : "#f6f6f6";
        s += '<path class="hx" data-i="'+i+'" d="'+hexPath(c.cx,c.cy)+'" fill="'+fill+'" stroke="#fff" stroke-width=".8"/>';
      });
      s += '</g><path d="'+path(h, geoBy[h.cd].rings[0])+'" fill="none" stroke="#111" stroke-width="1.1"/></svg>';
      document.getElementById("x-"+h.key).innerHTML = s;
      document.querySelectorAll("#x-"+h.key+" .hx").forEach(el => {
        el.addEventListener("mousemove", e => {
          const c = b.cells[+el.dataset.i];
          const parts = H.keys.map(k => c.by[k] ? nameN(k, c.by[k]) : null).filter(Boolean);
          showTip(e, '<span class="k">'+h.name+' · '+H.name+'</span><b>'+nf(c.n)+' place'+(c.n===1?'':'s')+' in this cell</b>'+(parts.join('<br>')||'Nothing recorded'));
          el.setAttribute("stroke","#111"); el.setAttribute("stroke-width","1.4");
        });
        el.addEventListener("mouseleave", () => { hideTip(); el.setAttribute("stroke","#fff"); el.setAttribute("stroke-width",".8"); });
      });
    });
    // legend + panel
    let grad = ""; for(let i=0;i<=10;i++) grad += ramp(H.ramp, .15+.85*i/10)+(i<10?",":"");
    document.getElementById("legendbox").innerHTML =
      datasetsLegend(H.keys)+
      '<h3>Places per hexagon</h3>'+
      '<div class="legend"><div class="bar" style="height:11px;border:1px solid #ddd;margin-bottom:5px;background:linear-gradient(90deg,'+grad+')"></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)"><span>1</span><span>'+max+'</span></div></div>'+
      '<div class="stat" style="margin-top:10px"><span><span class="sw" style="background:#f6f6f6;border:1px solid #ddd;border-radius:0"></span>Empty cell</span><b></b></div>'+
      stat("Hexagon size", (HEX_M*2)+" m across");
    document.getElementById("panel").innerHTML =
      '<h3>Coverage</h3>'+bins.map(b => {
        const inside = b.cells.filter(c => inRing(c.cx,c.cy,b.ring));
        const lit = inside.filter(c => c.n>0).length;
        return stat(b.h.name, lit+' of '+inside.length+' cells · '+Math.round(lit/inside.length*100)+'%');
      }).join("")+
      '<p class="note" style="margin-top:6px;border:0;padding:0">Share of hexagons with at least one place.</p>'+
      '<h3>Densest cells</h3><ul class="rank" id="dense">'+
      bins.flatMap(b => b.cells.map((c,i) => ({b,c,i}))).sort((x,y)=>y.c.n-x.c.n).slice(0,6).map((o,i) => {
        const mix = H.keys.length>1 ? ' <span style="color:#aaa">'+H.keys.filter(k=>o.c.by[k]).map(k => nameN(k, o.c.by[k])).join(', ')+'</span>' : '';
        return '<li data-h="'+o.b.h.key+'" data-i="'+o.i+'"><span class="nm"><span class="i">'+String(i+1).padStart(2,"0")+'</span>'+o.b.h.name+mix+'</span><span class="vl">'+o.c.n+'</span></li>';
      }).join("")+'</ul>';
    document.querySelectorAll("#dense li").forEach(li => {
      const el = document.querySelector('#x-'+li.dataset.h+' .hx[data-i="'+li.dataset.i+'"]');
      li.onmouseenter = () => { el.setAttribute("stroke","#111"); el.setAttribute("stroke-width","2.4"); el.parentNode.appendChild(el); };
      li.onmouseleave = () => { el.setAttribute("stroke","#fff"); el.setAttribute("stroke-width",".8"); };
    });
    views = [];
  }

  // ---------- 06 Conditions ----------
  const COND = {
    c_sit:        { name:"Sit",            keys:["stoop_hi","stoop_lo","benches"] },
    c_shelter:    { name:"Shelter",        keys:["shelters","sheds"] },
    c_social:     { name:"Social magnets", keys:["vendors","libraries","laundromats","barbers"] },
    c_permission: { name:"Permission",     keys:[] }
  };
  function condToggles(keys){
    return '<div class="colhd"><span></span><span></span><span>Har</span><span>Mid</span></div>'+
      keys.map(k => ALL_LAYERS[k]).map(L =>
        '<label class="lyr"><input type="checkbox" data-k="'+L.key+'"'+(on[L.key]?' checked':'')+'>'+
        '<span class="nm"><span class="sw" style="background:'+L.color+'"></span>'+L.name+(L.sub?' <span style="color:#999">· '+L.sub+'</span>':'')+'</span>'+
        '<span class="vl">'+nf(cnt(L,110))+'</span><span class="vl">'+nf(cnt(L,105))+'</span></label>').join("");
  }
  function sitPanel(){
    return '<h3>Estimated sitting area</h3>'+HOODS.map(h => {
      const e = C.sit[String(h.cd)], km2 = h.area*2.58999;
      return '<div style="margin:2px 0 10px"><div style="font-weight:600;font-size:11px;margin:6px 0 2px">'+h.name+'</div>'+
        stat("Sitting area, mid", '<span style="font-size:13px">'+nf(e.area_m2_mid)+' m²</span>')+
        stat("Range, low – high", nf(e.area_m2_low)+' – '+nf(e.area_m2_high)+' m²')+

  function renderCondition(key){
    const K = COND[key];

    if(key==="c_sit"){
      pn.innerHTML = '<h3>Estimated sitting area</h3>'+HOODS.map(h => {
        const e = C.sit[String(h.cd)], km2 = h.area*2.58999;
        return '<div style="margin:2px 0 10px"><div style="font-weight:600;font-size:11px;margin:6px 0 2px">'+h.name+'</div>'+
          stat("Sitting area, mid", '<span style="font-size:13px">'+nf(e.area_m2_mid)+' m²</span>')+
          stat("Range, low – high", nf(e.area_m2_low)+' – '+nf(e.area_m2_high)+' m²')+
          stat("Per km², mid", nf(Math.round(e.area_m2_mid/km2))+' m²')+
          stat("Seats, mid", nf(e.seats_mid)+' ('+Math.round(e.stoop_seats_mid/e.seats_mid*100)+'% on stoops)')+
          stat("Stoop lots, row house / tenement", nf(e.lots_high)+' / '+nf(e.lots_low))+
          stat("Benches", e.benches+' ('+e.bench_seats+' seats)')+'</div>';
      }).join("");
    } else {
      pn.innerHTML = '<h3>Per square mile</h3>'+K.keys.map(k => ALL_LAYERS[k]).map(L =>
        stat('<span class="sw" style="background:'+L.color+'"></span>'+L.name,
          (cnt(L,110)/HOODS[0].area).toFixed(1)+' / '+(cnt(L,105)/HOODS[1].area).toFixed(1))).join("")+
        '<p class="note" style="margin-top:6px;border:0;padding:0">Central Harlem / Midtown</p>';
    }
    bindToggles();
  }

  // ---------- Experiment 2: Central Harlem — scaffolding now & next ----------
  const X2 = D.x2;
  const AGE_BINS = [   // how long a shed has been up
    { max:90,       label:"Under 90 days",   color:"#fed976" },
    { max:180,      label:"90–180 days",     color:"#fd8d3c" },
    { max:365,      label:"6–12 months",     color:"#f03b20" },
    { max:730,      label:"1–2 years",       color:"#bd0026" },
    { max:1826,     label:"2–5 years",       color:"#7a0177" },
    { max:Infinity, label:"5 years +",       color:"#2d004b" }
  ];
  const ageBin = d => AGE_BINS.findIndex(b => d < b.max);
  const blockOf = bbl => +String(bbl).slice(1,6);
  const SUBCYC = {
    A:{ label:"10A · filing Feb 2025 – Feb 2027", color:"#1f5fbf", digits:[4,5,6,9] },
    B:{ label:"10B · filing opened Feb 2026",     color:"#0c8599", digits:[0,7,8] },
    C:{ label:"10C · filing opens 2027",          color:"#9c36b5", digits:[1,2,3] }
  };
  const subOf = bbl => { const d = blockOf(bbl) % 10; return Object.keys(SUBCYC).find(k => SUBCYC[k].digits.includes(d)); };
  const shedBbl = new Set(X2.S.map(r => r[1]));
  const yrs = d => d >= 365 ? (d/365.25).toFixed(1)+" years" : d+" days";
  const OWN = { C:"City-owned", M:"Mixed city & private", O:"Other public", P:"Private", X:"Tax-exempt (public / non-profit)" };
  const X2L = {
    shed: { key:"x2shed", r:4.2, tip:p => '<span class="k">Active sidewalk shed · '+AGE_BINS[ageBin(p[5])].label+'</span><b>'+esc(tc(p[2]))+'</b>Up for <b>'+yrs(p[5])+'</b>'+(p[5]>=365?' ('+nf(p[5])+' days)':'')+'<br>First permit '+p[3]+' · current permit expires '+p[4]+(p[6]>1?'<br>'+p[6]+' active shed jobs on this building':'')+(tallBy[p[1]]?'<br>'+tallBy[p[1]][3]+' floors · facade inspection building':'') },
    tall: { key:"x2tall", r:5, tip:p => '<span class="k">Over six floors · will need scaffolding</span><b>'+esc(tc(p[1]))+'</b>'+p[3]+' floors'+(p[4]?' · built '+p[4]:'')+(p[5]?' · '+nf(p[5])+' homes':'')+'<br>Facade inspection sub-cycle '+SUBCYC[subOf(p[0])].label+(OWN[p[6]]?'<br>'+OWN[p[6]]:'')+(p[7]?'<br>'+p[7]:'')+(shedBbl.has(p[0])?'<br><b>Shed up now</b>':'') }
  };
  const tallBy = {}; X2.tall.forEach(t => tallBy[t[0]] = t);
  function tc(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/\b\w/g, c => c.toUpperCase()).replace(/(\d)(St|Nd|Rd|Th)\b/g, (m,a,b) => a+b.toLowerCase()); }
  on.x2shed = true; on.x2tall = true;

  // ---- base map: building outlines, tax blocks, streets ----
  function decPts(str){ const pts=[]; let x=0, y=0; str.split(",").forEach(pr => { const [a,b] = pr.split(" "); x += parseInt(a,36); y += parseInt(b,36); pts.push([x/1e5-74, y/1e5+40]); }); return pts; }
  let BASE = null;
  function baseMap(h){
    if(BASE) return BASE;
    const P = pts => "M"+pts.map(p => h.px(p[0]).toFixed(1)+","+h.py(p[1]).toFixed(1)).join("L");
    const B = X2.base;
    const bldg = B.B.map(([bin, ht, fc, bbl, e]) => ({ bin, ht, bbl, d:P(decPts(e))+"Z" }));
    // streets: draw every segment; label each named street once per ~600 m along its longest pieces
    const streets = B.S.map(([name, type, w, e]) => { const pts = decPts(e); return { name, type, pts, d:P(pts) }; });
    const labels = [], byName = {};
    streets.forEach(st => { if(!st.name || st.type !== 1 || st.pts.length < 2) return;

    let lg = '';
